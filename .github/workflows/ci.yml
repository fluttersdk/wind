name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows-lint:
    name: Workflows lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: dependabot.yml shape
        if: hashFiles('.github/dependabot.yml') != ''
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/dependabot.yml'))"
          echo "dependabot.yml parses as valid YAML"

  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/lib/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Analyze the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run tests with coverage (90% floor)
        run: ./tool/coverage.sh 90

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Validate publish archive
        run: dart pub publish --dry-run

      # The package is web and WebAssembly compatible through flutter_svg's
      # conditional exports. pana 0.23.13 mis-evaluates `dart.library.js_interop`
      # there and reports the package as not web-compatible; pana 0.23.19 is what
      # pub.dev runs today and gets it right, so this step is pinned to it.
      - name: Assert WASM-ready (pana)
        run: |
          dart pub global activate pana 0.23.19
          dart pub global run pana --json --no-warning . > pana.json
          python3 -c "import json, sys; tags = json.load(open('pana.json')).get('tags', []); ok = 'is:wasm-ready' in tags; print('OK: is:wasm-ready present' if ok else 'FAIL: is:wasm-ready missing; tags=' + repr(tags)); sys.exit(0 if ok else 1)"

  changes:
    name: Detect demo-affecting changes
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse "$BEFORE^{commit}" >/dev/null 2>&1; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^(lib|example|web|tool)/|^pubspec\.(yaml|lock)$|^\.github/workflows/ci\.yml$'; then
            echo "demo=true" >> "$GITHUB_OUTPUT"
            echo "demo-affecting changes detected"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
            echo "no demo-affecting changes; skipping the demo build"
          fi

  build-demo:
    name: Build Demo (preview gallery)
    needs: [ci, changes]
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      # The docs site builds and serves the gallery itself (its
      # scripts/build-wind-demo.sh), so this job only proves the gallery still
      # compiles for the web with the same flags before the site does.
      - name: Build Demo (lib/main.dart)
        working-directory: example
        run: flutter build web --release --target lib/main.dart --base-href=/ --pwa-strategy=none --no-web-resources-cdn
