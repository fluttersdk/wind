name: Docs Link Check

# fluttersdk.com renders doc/ verbatim and validates nothing on the way in:
# DocLinkExtension strips the .md suffix off internal links without checking the
# target resolves, DocsScaffolder upserts every page it finds, and the
# <x-preview> component builds its demo iframe and GitHub blob URLs straight from
# the tag attributes. A typo therefore survives the sync and ships as a dead link
# or an empty preview. This workflow is where that gets caught instead.

on:
  # No paths filter on purpose. A required status check has to report on every
  # PR: with a filter, a PR that touches only lib/ never triggers this workflow,
  # the check never reports, and the PR waits on a status that will never
  # arrive. The gate costs a couple of seconds, so it runs everywhere and stays
  # requireable. deploy.yml takes the same shape and filters inside a job.
  pull_request:
    branches: [master]
  schedule:
    # Mondays at 08:00 UTC: external-URL rot pass. Kept off the PR path so a
    # rate-limited host or an expired third-party page never blocks a doc merge.
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  internal:
    name: Internal Links & Previews
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The wind-specific gate: page structure, relative .md targets, in-page and
      # cross-page fragments, both halves of every <x-preview>, and self-referential
      # fluttersdk.com raw-markdown URLs. Pure stdlib Python, no network and no
      # Flutter toolchain, so `python3 tool/check-docs.py` reproduces this locally.
      - name: Check docs structure, fragments and previews
        run: python3 tool/check-docs.py

      # Second pass for link forms the script does not parse, HTML <a href> and
      # <img src> among them. Fragments stay out of scope here on purpose: the
      # bundled lychee 0.24.2 slugifies headings with a simplified kebab-case that
      # collapses runs of whitespace, so a heading like "Date + Time Selection"
      # would be reported as broken even though GitHub and fluttersdk.com both
      # render it as #date--time-selection. tool/check-docs.py owns fragments and
      # matches the rendered output.
      - name: Check internal links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            'doc/**/*.md'
            '*.md'
          fail: true

  external:
    name: External Links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every outbound URL in the reference, badges and pub.dev pages included.
      # .lycheeignore (regex, one pattern per line) is picked up automatically.
      #
      # --accept widens lychee's default 100..=103,200..=299 with 429 and the
      # WHOLE 5xx range because this job hunts link ROT, and neither says a link
      # is gone: they say the host is up and unhappy. 500..=504 would have
      # covered the failure that prompted this and left the same class failing
      # one door down, since Cloudflare's 520, 521, 524 and 530 sit outside it
      # and are exactly an origin that did not answer. The 2026-09-07 run failed
      # on three 504s from github.com, all of them this repo's own compare and
      # tag pages, which render fine in a browser. Rate limiting is not the cause
      # and a token is not the fix: lychee-action already defaults its `token`
      # input to `${{ github.token }}` and exports it as GITHUB_TOKEN, and
      # lychee already retries three times by default. 404 and 410 still fail
      # the job, which is what rot actually looks like.
      #
      # No request cache here, deliberately. `actions/cache` declares
      # `post-if: success()`, so the save is skipped on exactly the runs a
      # retry would follow, and the whole pass costs under four seconds for 939
      # links (run 34150081246), so there is nothing to buy back.
      - name: Check all links including external
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept '100..=103,200..=299,429,500..=599'
            'doc/**/*.md'
            '*.md'
            'llms.txt'
          fail: true
