name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # pub.dev trusts every tag that matches the pattern, so a tag pushed from
      # an unmerged branch would publish code that skipped the pull request and
      # its checks. Release from the merge commit on master.
      - name: Require the tag to sit on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master; tag the merge commit." >&2
            exit 1
          fi

      # The tag, pubspec.yaml and the dartdoc source link must name one version,
      # or pub.dev, the GitHub Release and the API reference's "view source"
      # links would each carry a different one. The agent skill keeps its own
      # version line, so it is not compared.
      - name: Check version stamps
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pubspec="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          dartdoc="$(sed -n 's|.*/blob/\([^/]*\)/.*|\1|p' dartdoc_options.yaml | head -1)"
          if [ "$TAG" != "$pubspec" ] || [ "$TAG" != "$dartdoc" ]; then
            echo "::error::Version mismatch: tag $TAG, pubspec.yaml $pubspec, dartdoc_options.yaml $dartdoc." >&2
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/lib/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Analyze the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run tests with coverage (90% floor)
        run: ./tool/coverage.sh 90

      - name: Validate publish archive
        run: flutter pub publish --dry-run

      # pub.dev scores 160 points and a release that loses any of them stops
      # here, before the irreversible publish. A repository URL that does not
      # match the default branch's pubspec.yaml costs the 10 points of "valid
      # pubspec"; an unreachable homepage only warns.
      #
      # Pinned to 0.23.19, the version pub.dev runs today, not the standard
      # 0.23.13: 0.23.13 mis-evaluates flutter_svg's `dart.library.js_interop`
      # conditional export and reports the package as web-incompatible, which
      # costs 10 platform points and the `is:wasm-ready` tag, although
      # `flutter build web --wasm` compiles it and pub.dev scores it 160/160.
      - name: Require full pub.dev points (pana)
        run: |
          dart pub global activate pana 0.23.19
          dart pub global run pana --no-warning --exit-code-threshold 0 .

      # Runs before the irreversible publish: a tag without a `## [<version>]`
      # section in CHANGELOG.md stops here instead of shipping a version with
      # no GitHub Release.
      - name: Extract changelog section
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          notes="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## / { exit }
            flag && /^---$/ { next }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION; refusing to publish a version without release notes." >&2
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$notes"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

  github-release:
    name: GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          case "$VERSION" in
            *-*) FLAG="--prerelease" ;;
            *) FLAG="--latest" ;;
          esac
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --verify-tag \
            "$FLAG"

  # Mirrors skills/wind-ui/ into the skill registry (anilcancakir/ai) after a
  # stable release. Pre-releases are not mirrored, so a pre-release tag never
  # reaches the consumers of `npx skills add anilcancakir/ai`. It runs only
  # after the GitHub Release job, so the registry never gets a skill whose
  # release failed. Called here and not triggered by `release: [published]`,
  # because GitHub starts no workflow run from an event raised by GITHUB_TOKEN.
  # The secrets are named, not inherited: the called workflow needs exactly these
  # two, and this repo pins every action by SHA and runs zizmor over the result.
  registry:
    name: Sync skill to registry
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/dispatch-to-registry.yml
    secrets:
      REGISTRY_BOT_APP_ID: ${{ secrets.REGISTRY_BOT_APP_ID }}
      REGISTRY_BOT_PRIVATE_KEY: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}
