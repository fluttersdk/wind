name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ example/lib/

      - name: Analyze code
        run: dart analyze lib/ test/ example/lib/

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run tests with coverage (90% floor)
        run: ./tool/coverage.sh 90

      - name: Validate publish archive
        run: dart pub publish --dry-run

  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog section
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          notes="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION; refusing to create a release with empty notes." >&2
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$notes"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
            *) PRERELEASE="--latest" ;;
          esac
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --verify-tag \
            $PRERELEASE

  # Called here rather than triggered by `release: [published]`, which is what
  # dispatch-to-registry.yml used to declare. The release above is created with
  # `GH_TOKEN: ${{ github.token }}`, and GitHub does not start workflow runs
  # from events raised by GITHUB_TOKEN, so that trigger could never fire and
  # never did: the 1.4.0 skill reached the registry only because it was
  # dispatched by hand. Sequencing it after github-release also keeps the
  # registry version tracking packages pub.dev actually accepted.
  registry:
    name: Sync skill to registry
    needs: github-release
    # Stable releases only. The tag filter above is `[0-9]+.[0-9]+.[0-9]+*`, so
    # `1.5.0-beta.1` matches it, and the extractor in the called workflow strips
    # a `+build` suffix but not a `-beta.1` one: the registry would receive
    # "1.5.0-beta.1" for a step whose job is to bump a version triplet. This repo
    # has shipped `1.0.0-alpha.*` tags before, and until this PR the registry
    # path could never execute at all, so this is the first release where it
    # could happen.
    #
    # A branch name carrying a dash cannot be caught by this: on a
    # `workflow_dispatch` the `github-release` job is skipped by its own tag
    # guard, and a dependant of a skipped job is skipped too, so `registry` only
    # ever evaluates this on a tag push.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/dispatch-to-registry.yml
    # Named rather than `secrets: inherit`: the called workflow needs exactly
    # these two, and this repo pins every action by SHA and runs zizmor over
    # the result, so handing it the whole secret store would be out of step.
    secrets:
      REGISTRY_BOT_APP_ID: ${{ secrets.REGISTRY_BOT_APP_ID }}
      REGISTRY_BOT_PRIVATE_KEY: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}
