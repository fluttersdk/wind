# Auto-sync the FlutterSDK AI registry when a wind release is published.
#
# Fires repository_dispatch at fluttersdk/ai on a published GitHub release, or
# on a manual run. The registry's sync.yml receives the event, pulls the
# skills/wind-ui/ subtree, bumps the version triplet, and pushes to main.
#
# Deliberately NOT on every push. A skill edit that lands on master between
# releases waits for the release that carries it, so the registry version
# tracks published packages instead of counting commits: under the old push
# trigger the registry reached v1.3.75, most of those re-publishing the same
# skill content. Reach for the manual run when a skill fix has to arrive
# before the next release.
#
# Auth: uses the fluttersdk-registry GitHub App (1-hour mint-on-demand
# tokens). Requires REGISTRY_BOT_APP_ID + REGISTRY_BOT_PRIVATE_KEY
# secrets on this repo (same values as on fluttersdk/ai).

name: Dispatch skill update to registry

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 1

            - name: Extract version
              id: ver
              run: |
                  set -euo pipefail
                  if [[ -n "${GITHUB_REF_NAME}" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                      VER="${GITHUB_REF_NAME#v}"
                  else
                      VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
                  fi
                  # Strip Dart/Flutter build metadata suffix (e.g. 1.2.3+4 -> 1.2.3)
                  VER="${VER%%+*}"
                  if [[ -z "$VER" ]]; then
                      echo "::error::could not extract a non-empty version from ref or pubspec.yaml"
                      exit 1
                  fi
                  echo "version=$VER" >> "$GITHUB_OUTPUT"

            - name: Mint App token scoped to fluttersdk/ai
              id: app-token
              uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
              with:
                  app_id: ${{ secrets.REGISTRY_BOT_APP_ID }}
                  private_key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}
                  installation_retrieval_mode: repository
                  installation_retrieval_payload: fluttersdk/ai
                  repositories: '["ai"]'

            - name: Fire repository_dispatch to fluttersdk/ai
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  repository: fluttersdk/ai
                  event-type: skill-updated
                  client-payload: |
                      {
                          "source": "wind",
                          "version": "${{ steps.ver.outputs.version }}",
                          "sha": "${{ github.sha }}"
                      }
