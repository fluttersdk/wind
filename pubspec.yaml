name: wind_kit
description: "Tailwind CSS for Flutter: utility-first className styling ('flex p-4 dark:bg-gray-800') with dark mode, responsive breakpoints, hover states and theming built in. No codegen."
version: 1.11.1
homepage: https://anilcancakir.com/wind_kit
repository: https://github.com/anilcancakir/wind_kit
issue_tracker: https://github.com/anilcancakir/wind_kit/issues
topics:
  - ui
  - widget
  - tailwind
  - responsive
  - design-system

screenshots:
  - description: "Wind example gallery: Tailwind-syntax className UI rendered with W-prefix widgets, dark mode, and responsive breakpoints."
    path: screenshots/wind-gallery-overview.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Declared explicitly so pub.dev's platform detection is not silently narrowed
# by the `dart:io` import-graph trace; wind supports every Flutter platform.
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.1.6
  flutter_svg: ^2.0.0
  material_ui: ^1.11.0
  wind_kit_diagnostics_contracts: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
